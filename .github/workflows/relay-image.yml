name: provider relay image

on:
  push:
    branches: [main]
    tags: ["relay-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/mwodevelop/mwoscrapers-relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Export exact tracked head
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/candidate-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/candidate-tree"
      - name: Scan exact head before executing the Docker build
        uses: mwoDevelop/kodi/.github/actions/upstream-malware-scan@8b4fe96708d1e2e64cf535e3726fa7a9a4a1adb6
        with:
          candidate-path: ${{ runner.temp }}/candidate-tree
          output: ${{ runner.temp }}/relay-security-report.json
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Sign in to GHCR for an immutable release
        if: >-
          startsWith(github.ref, 'refs/tags/relay-v') ||
          github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build multi-architecture relay
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm/v7
          push: >-
            ${{ startsWith(github.ref, 'refs/tags/relay-v') ||
                github.event_name == 'workflow_dispatch' }}
          tags: ghcr.io/mwodevelop/mwoscrapers-relay:sha-${{ github.sha }}
          build-args: BUILD_REVISION=git:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-release:
    if: >-
      startsWith(github.ref, 'refs/tags/relay-v') ||
      github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Verify immutable manifest platforms
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw \
            > manifest.json
          python - <<'PY'
          import json

          manifest = json.load(open("manifest.json", encoding="utf-8"))
          platforms = {
              (
                  entry.get("platform", {}).get("os"),
                  entry.get("platform", {}).get("architecture"),
                  entry.get("platform", {}).get("variant"),
              )
              for entry in manifest.get("manifests", [])
          }
          required = {
              ("linux", "amd64", None),
              ("linux", "arm", "v7"),
          }
          missing = required - platforms
          if missing:
              raise SystemExit(f"missing release platforms: {sorted(missing)}")
          print("verified platforms: linux/amd64, linux/arm/v7")
          PY
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mwoscrapers-relay-image-digest
          path: image-digest.txt
          retention-days: 90
