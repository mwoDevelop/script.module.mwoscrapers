name: provider relay image

on:
  push:
    branches: [main]
    tags: ["relay-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ghcr.io/mwodevelop/mwoscrapers-relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Export exact tracked head
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/candidate-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/candidate-tree"
      - name: Scan exact head before executing the Docker build
        uses: mwoDevelop/kodi/.github/actions/upstream-malware-scan@d7a1cca09e056fbbdebb2ba2d231e175eea7455b
        with:
          candidate-path: ${{ runner.temp }}/candidate-tree
          output: ${{ runner.temp }}/relay-security-report.json
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GHCR for an immutable release
        if: startsWith(github.ref, 'refs/tags/relay-v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build multi-architecture relay
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm/v7
          push: ${{ startsWith(github.ref, 'refs/tags/relay-v') }}
          tags: ghcr.io/mwodevelop/mwoscrapers-relay:sha-${{ github.sha }}
          build-args: BUILD_REVISION=git:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-release:
    if: startsWith(github.ref, 'refs/tags/relay-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify immutable manifest platforms
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw \
            > manifest.json
          python - <<'PY'
          import json

          manifest = json.load(open("manifest.json", encoding="utf-8"))
          platforms = {
              (
                  entry.get("platform", {}).get("os"),
                  entry.get("platform", {}).get("architecture"),
                  entry.get("platform", {}).get("variant"),
              )
              for entry in manifest.get("manifests", [])
          }
          required = {
              ("linux", "amd64", None),
              ("linux", "arm", "v7"),
          }
          missing = required - platforms
          if missing:
              raise SystemExit(f"missing release platforms: {sorted(missing)}")
          print("verified platforms: linux/amd64, linux/arm/v7")
          PY
      - name: Record immutable deployment reference
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mwoscrapers-relay-image-digest
          path: image-digest.txt
          retention-days: 90
