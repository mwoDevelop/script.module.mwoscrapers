name: check provider upstreams

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: provider-upstream-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download pinned artifacts
        run: >-
          python tools/check_upstreams.py
          --output upstream-audit
          --markdown upstream-audit.md
      - name: Scan downloaded immutable provider artifacts
        uses: mwoDevelop/kodi/.github/actions/upstream-malware-scan@8b4fe96708d1e2e64cf535e3726fa7a9a4a1adb6
        with:
          candidate-path: upstream-audit
          output: upstream-security-report.json
      - name: Verify exact provider artifact scan coverage
        run: >-
          python tools/verify_audit_scan.py
          --audit-dir upstream-audit
          --report upstream-security-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: upstream-audit
          path: |
            upstream-audit
            upstream-audit.md
            upstream-security-report.json
          retention-days: 14
