name: check provider upstreams

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: provider-upstream-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download pinned artifacts
        run: >-
          python tools/check_upstreams.py
          --output upstream-audit
          --markdown upstream-audit.md
      - name: Scan downloaded immutable provider artifacts
        uses: mwoDevelop/kodi/.github/actions/upstream-malware-scan@8b4fe96708d1e2e64cf535e3726fa7a9a4a1adb6
        with:
          candidate-path: upstream-audit
          output: upstream-security-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: upstream-audit
          path: |
            upstream-audit
            upstream-audit.md
            upstream-security-report.json
          retention-days: 14
