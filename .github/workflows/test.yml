name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  malware-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Export exact tracked head
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/candidate-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/candidate-tree"
      - name: Scan exact head before executing provider code
        uses: mwoDevelop/kodi/.github/actions/upstream-malware-scan@8b4fe96708d1e2e64cf535e3726fa7a9a4a1adb6
        with:
          candidate-path: ${{ runner.temp }}/candidate-tree
          output: ${{ runner.temp }}/security-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mwo-scrapers-security-report
          path: ${{ runner.temp }}/security-report.json
          retention-days: 14

  test:
    needs: malware-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check lib relay tests tools
      - run: pytest
      - run: python tools/validate_addon.py .
