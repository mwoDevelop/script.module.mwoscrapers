name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  malware-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Export exact tracked head
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/candidate-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/candidate-tree"
      - name: Scan exact head before executing provider code
        uses: mwoDevelop/kodi/.github/actions/upstream-malware-scan@304964cf75011827758dfb994f9811367cab89f3
        with:
          candidate-path: ${{ runner.temp }}/candidate-tree
          output: ${{ runner.temp }}/security-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mwo-scrapers-security-report
          path: ${{ runner.temp }}/security-report.json
          retention-days: 14

  test:
    needs: malware-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check lib relay tests tools
      - run: pytest
      - run: python tools/validate_addon.py .
