name: discover provider upstreams

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: provider-upstream-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Resolve feeds and inspect immutable artifacts
        run: >-
          python tools/discover_upstreams.py
          --output upstream-discovery.json
          --markdown upstream-discovery.md
      - name: Publish discovery report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-discovery
          path: |
            upstream-discovery.json
            upstream-discovery.md
          retention-days: 14
      - name: Open or update review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed="$(python -c 'import json; print(str(json.load(open("upstream-discovery.json"))["changed"]).lower())')"
          if [ "$changed" != "true" ]; then
            exit 0
          fi
          title="Provider upstream update detected"
          issue="$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "'"$title"'") | .number' | head -n 1)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file upstream-discovery.md
          else
            gh issue create --title "$title" --body-file upstream-discovery.md
          fi
